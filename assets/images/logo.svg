<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="40" height="40">
  <!-- Circle background -->
  <circle cx="50" cy="50" r="47" fill="#FFFFFF" stroke="#0B4A26" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="#0B4A26" stroke-width="1" stroke-dasharray="2 2"/>
  
  <!-- Triangle / 'A' Symbol -->
  <!-- Left half -->
  <path d="M50 16 L24 64 L37 64 L44 50 L50 50 Z" fill="#0B4A26"/>
  <!-- Right half -->
  <path d="M50 16 L76 64 L63 64 L56 50 L50 50 Z" fill="#0B4A26"/>
  
  <!-- Ribbon background folded ends -->
  <path d="M18 50 L10 50 L14 56 L10 62 L18 62 Z" fill="#D4B26F" stroke="#0B4A26" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M82 50 L90 50 L86 56 L90 62 L82 62 Z" fill="#D4B26F" stroke="#0B4A26" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Main Banner Rect -->
  <rect x="16" y="47" width="68" height="16" rx="1.5" fill="#FFFFFF" stroke="#0B4A26" stroke-width="2"/>
  
  <!-- Banner Text "SMD" -->
  <text x="50" y="59" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="900" fill="#C41E3A" text-anchor="middle" letter-spacing="1">SMD</text>
  
  <!-- "SINCE 1994" Text at Bottom -->
  <text x="50" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="800" fill="#0B4A26" text-anchor="middle" letter-spacing="0.5">SINCE 1994</text>
</svg>
